<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Задачі')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="card">
        <div class="card-title">
            <h1>Задачі</h1>
            <a class="btn primary" th:href="@{/tasks/new}">+ Нова задача</a>
        </div>

        <p class="muted" th:if="${#lists.isEmpty(tasks)}">Задач поки немає. Створіть першу!</p>

        <table th:unless="${#lists.isEmpty(tasks)}">
            <thead>
            <tr>
                <th>#</th>
                <th>Задача</th>
                <th>
                    <a class="sort" title="Сортувати за пріоритетом"
                       th:href="@{/(sort='priority', dir=${sort == 'priority' and dir == 'desc' ? 'asc' : 'desc'})}">
                        Пріоритет
                        <span class="sort-icon" th:classappend="${sort != 'priority'} ? 'inactive'"
                              th:text="${sort == 'priority' ? (dir == 'desc' ? '↓' : '↑') : '↕'}">↕</span>
                    </a>
                </th>
                <th>
                    <a class="sort" title="Сортувати за терміном"
                       th:href="@{/(sort='dueDate', dir=${sort == 'dueDate' and dir == 'asc' ? 'desc' : 'asc'})}">
                        Термін
                        <span class="sort-icon" th:classappend="${sort != 'dueDate'} ? 'inactive'"
                              th:text="${sort == 'dueDate' ? (dir == 'desc' ? '↓' : '↑') : '↕'}">↕</span>
                    </a>
                </th>
                <th>Статус</th>
                <th>Дії</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}" th:classappend="${task.completed} ? 'done'">
                <td th:text="${task.id}">1</td>
                <td>
                    <div class="title" th:text="${task.title}">Назва задачі</div>
                    <div class="muted" th:text="${task.description} ?: 'Без опису'">Опис</div>
                </td>
                <td th:switch="${task.priority.code}">
                    <span th:case="'CRITICAL'" class="badge badge-critical" th:text="${task.priority.name}">Критичний</span>
                    <span th:case="'HIGH'" class="badge badge-high" th:text="${task.priority.name}">Високий</span>
                    <span th:case="'MEDIUM'" class="badge badge-medium" th:text="${task.priority.name}">Середній</span>
                    <span th:case="*" class="badge badge-low" th:text="${task.priority.name}">Низький</span>
                </td>
                <td>
                    <span th:text="${task.dueDate != null} ? ${#temporals.format(task.dueDate, 'dd.MM.yyyy HH:mm')} : 'Без терміну'">01.01.2026 18:00</span>
                    <span class="badge badge-overdue" th:if="${task.isOverdue(now)}">Прострочено</span>
                </td>
                <td th:text="${task.status.displayName}">До виконання</td>
                <td class="actions">
                    <form class="inline" th:unless="${task.completed}"
                          th:action="@{/tasks/{id}/complete(id=${task.id})}" method="post">
                        <button type="submit">Виконано</button>
                    </form>
                    <a class="btn" th:href="@{/tasks/{id}/edit(id=${task.id})}">Редагувати</a>
                    <form class="inline" th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post">
                        <button type="submit" class="danger">Видалити</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
